services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: texmoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - texmoto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d texmoto"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  texmoto_postgres_data:

