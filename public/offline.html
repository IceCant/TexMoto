<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>TexMoto · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f4f7fb; color: #142033; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); border: 1px solid #dce5f0; border-radius: 22px; background: #fff; padding: 30px; box-shadow: 0 20px 50px rgba(34, 62, 105, .1); text-align: center; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 17px; background: #2563eb; color: #fff; font-weight: 900; }
      h1 { margin: 0; font-size: 1.7rem; letter-spacing: -.04em; }
      p { margin: 12px 0 24px; color: #68758a; line-height: 1.6; }
      button { min-height: 48px; width: 100%; border: 0; border-radius: 13px; background: #2563eb; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">TM</div>
      <h1>You’re offline</h1>
      <p>TexMoto needs a connection to load fresh shop, motorcycle, customer, and sales data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
